# =========================
# LOCAL LAPTOP CONFIG (12GB RAM)
# =========================

data:
  raw_data_dir: "data/raw"
  tiles_dir: "data/tiles"
  annotations_dir: "data/annotations"
  train_val_split: 0.8
  split_seed: 42
  split_strategy: per_village

  tile_size: 256
  tile_overlap: 32
  min_valid_pixels: 0.7

  input_channels: 3

  segmentation_classes:
    0: "background"
    1: "building_rcc"
    2: "building_tiled"
    3: "building_tin"
    4: "building_others"
    5: "road"
    6: "waterbody"

  detection_classes:
    0: "distribution_transformer"
    1: "overhead_tank"
    2: "well"

  num_seg_classes: 7
  num_det_classes: 3


model:
  segmentation:
    encoder_name: "mobilenet_v2"
    encoder_weights: "imagenet"
    decoder: "unet"
    activation: null
    in_channels: 3
    classes: 7

  detection:
    model_name: "yolov5n"
    classes: 3
    pretrained: true


training:
  batch_size: 10                      # Reduced for RAM safety (increase to 16 if GPU available)
  num_workers: 4                     # Safe for Windows (reduce to 2 on slower systems)
  epochs_per_village_batch: 3        # Per-village epochs (3-6 recommended)
  max_epochs: 5                     # Total epochs across all batches (25-40 for production)
  validation_frequency: 1            # Validate every N epochs (1 or 2 recommended)
  use_balanced_sampling: true        # Enable class-balanced sampling (IMPORTANT for accuracy)


optimization:
  learning_rate: 0.0005        # Slightly higher (small batch)
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  optimizer: "adamw"
  use_amp: false                # USE if GPU available
  gradient_accumulation_steps: 2
  early_stopping_patience: 1
  max_gradient_norm: 1.0


checkpointing:
  checkpoint_dir: "outputs/checkpoints"
  save_best_only: true
  save_frequency: 2


incremental:
  enabled: false
  villages_per_batch: 1
  use_ewc: false
  ewc_lambda: 0.4
  replay_buffer_size: 2000     # Reduced memory usage


augmentation:
  train:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate_90: 0.5
    random_brightness_contrast: 0.3
    gaussian_noise: 0.1

  val:
    normalize: true


inference:
  stride: 224                        # Sliding window stride (224 = 256-32, increase for speed)
  batch_size: 1                      # Batch size for inference (1 for CPU, 4-8 for GPU)
  confidence_threshold: 0.5          # Classification confidence threshold (0.5 recommended)
  min_building_area: 25              # Minimum polygon area for buildings (pixels)
  min_road_length: 10                # Minimum line length for roads (pixels)
  output_dir: "outputs/predictions"  # Output directory for predictions
  save_geotiff: true                 # Save prediction as GeoTIFF
  save_shapefile: true               # Save features as shapefile/GeoPackage


hardware:
  device: "cpu"               # fallback handled in code
  pin_memory: true
  memory_limit_gb: 16


logging:
  log_dir: "outputs/logs"
  log_level: "INFO"
  save_frequency: 200
  visualize_predictions: true
  visualization_dir: "outputs/visualizations"


evaluation:
  metrics: ["iou", "dice", "precision", "recall", "f1", "accuracy"]

target_accuracy: 0.95